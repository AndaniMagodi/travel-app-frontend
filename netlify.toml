[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned to a version that satisfies the "engines" field in package.json
  # (^22.18.0 || >=24.12.0). Netlify's default Node may not.
  NODE_VERSION = "22.18.0"

  # Vite inlines env vars at BUILD time, and .env is gitignored — so without
  # this the production bundle ships VITE_API_URL as undefined and every
  # search hits "undefined/api/trip". This is the public Cloud Run backend
  # URL, already visible in the client bundle, so it is not a secret.
  # VITE_UNSPLASH_KEY is deliberately NOT set here: nothing reads it, and a
  # key does not belong in version control.
  VITE_API_URL = "https://travel-backend-24498069160.africa-south1.run.app"

# Single-page app: serve index.html for any path so a refresh on a deep link
# doesn't 404. The app has no client-side router today, but this costs
# nothing and stops a future route from breaking on reload.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
